databases:
  - name: agenda-db
    plan: free
    region: virginia
    databaseName: agenda
    user: agenda
    ipAllowList: []

services:
  - type: web
    name: agenda-contatos
    runtime: python
    plan: free
    region: virginia
    buildCommand: bash build.sh
    startCommand: gunicorn project.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_DATABASE_SSL_REQUIRE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
