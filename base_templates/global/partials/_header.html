<header class="header">
  <div class="header-container">
    <a href="{% url 'contact:index' %}" class="brand" aria-label="Agenda — página inicial">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>Agenda</span>
    </a>

    <nav class="menu" aria-label="Navegação principal">
      <ul class="menu-list">
        {% if user.is_authenticated %}
          <li class="menu-item">
            <a href="{% url 'contact:index' %}" class="menu-link">Contatos</a>
          </li>
          <li class="menu-item">
            <a href="{% url 'contact:create' %}" class="menu-link">Novo contato</a>
          </li>
          <li class="menu-item">
            <a href="{% url 'contact:user_update' %}" class="menu-link">Meu perfil</a>
          </li>
        {% else %}
          <li class="menu-item">
            <a href="{% url 'contact:login' %}" class="menu-link">Entrar</a>
          </li>
          <li class="menu-item">
            <a href="{% url 'contact:register' %}" class="menu-link menu-link-highlight">Criar conta</a>
          </li>
        {% endif %}
      </ul>
    </nav>

    {% if user.is_authenticated %}
      <div class="header-actions">
        <form class="search-form" action="{% url 'contact:search' %}" method="GET" role="search">
          <label class="sr-only" for="search">Buscar contatos</label>
        <input 
            type="search"
            class="search-input"
            placeholder="Buscar contato"
            id="search"
            name="q"
            value="{{ request.GET.q.strip }}"
          >
          <button class="search-button" type="submit">Buscar</button>
        </form>

        <form action="{% url 'contact:logout' %}" method="POST">
          {% csrf_token %}
          <button class="menu-link menu-button" type="submit">Sair</button>
        </form>
      </div>
    {% endif %}
  </div>
</header>
