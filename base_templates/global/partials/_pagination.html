{% if page_obj %}
  <nav class="pagination" aria-label="Paginação">
    {% if page_obj.has_previous %}
      <a class="pagination-link" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q.strip }}">← Anterior</a>
    {% else %}
      <span class="pagination-link is-disabled">← Anterior</span>
    {% endif %}

    <span class="pagination-current">
      Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
      <a class="pagination-link" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q.strip }}">Próxima →</a>
    {% else %}
      <span class="pagination-link is-disabled">Próxima →</span>
    {% endif %}
  </nav>
{% endif %}
