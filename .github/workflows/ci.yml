name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-in-production
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Validate production configuration
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-production-check-secret-key-with-more-than-fifty-characters
          DJANGO_ALLOWED_HOSTS: agenda.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://agenda.example.com
          DATABASE_URL: postgresql://agenda:secret@localhost:5432/agenda
          DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          DJANGO_SECURE_HSTS_PRELOAD: "true"
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput
          gunicorn --check-config project.wsgi:application

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: python -m coverage run manage.py test --verbosity=2

      - name: Enforce coverage threshold
        run: python -m coverage report --fail-under=95

      - name: Build HTML coverage report
        run: python -m coverage html

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov
          if-no-files-found: error
          retention-days: 14
